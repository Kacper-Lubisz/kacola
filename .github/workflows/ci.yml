name: ci
on: [push, pull_request]

jobs:
  # T0 unit + T1 contract + T2 integration + boundaries + lint + typecheck. Hermetic and fast: this is
  # the blocking gate and must never need audio hardware, a display, or network access to an LLM.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # T3: real PipeWire graph, real models, headless compositor for the UI. Needs a runner image with
  # PipeWire, mutter and GTK 4.20+/libadwaita 1.8+ — ubuntu-24.04 is too old, hence the Fedora container.
  # The Electron window's suites (packages/e2e/test/desktop-*.e2e.test.ts) run here too, headless: each
  # window opens inside a private headless GNOME Shell (testkit startHeadlessDisplay: no DISPLAY, no GPU,
  # Chromium falls back to SwiftShader). Electron needs Chromium's shared libraries (the second dnf line),
  # tesseract reads screenshots back (the "an API key never shows on screen" check), and Chromium's
  # sandbox refuses to run as root — so everything after the checkout runs as an unprivileged user.
  e2e:
    runs-on: ubuntu-24.04
    container: { image: 'registry.fedoraproject.org/fedora:44', options: '--privileged' }
    needs: check
    steps:
      - run: dnf install -y nodejs24 pnpm git pipewire pipewire-utils wireplumber gnome-shell mutter gtk4-devel libadwaita-devel glib2-devel gtksourceview5 wl-clipboard ffmpeg-free python3-gobject at-spi2-core dbus-daemon tar bzip2 util-linux coreutils desktop-file-utils systemd gjs evolution-data-server unzip
      - run: dnf install -y nss nspr atk at-spi2-atk cups-libs libdrm mesa-libgbm mesa-dri-drivers libxkbcommon libXcomposite libXdamage libXrandr libXfixes libxshmfence alsa-lib gtk3 pango cairo tesseract tesseract-langpack-eng
      - uses: actions/checkout@v4
      - run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          install -d -m 700 -o ci -g ci /tmp/ci-runtime
      # as the ci user: node_modules, the Electron download and the model cache belong to it
      - run: runuser -u ci -- env HOME=/home/ci pnpm install --frozen-lockfile
      # No audio hardware in a container: stand-in default devices with high priority so the rig has
      # defaults to leave untouched (unverified in CI — see the capture work stream's report).
      - run: >
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/ci-runtime
          dbus-run-session -- bash -c 'pipewire & wireplumber & sleep 2 &&
          pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=ci-speakers media.class=Audio/Sink object.linger=true priority.session=2000 }" &&
          pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=ci-mic media.class=Audio/Source/Virtual object.linger=true priority.session=2000 }" &&
          sleep 1 && pnpm test:e2e'
